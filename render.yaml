# Render Blueprint: one web service that serves both the API and the built frontend.
# In Render: New > Blueprint > pick this repo. Fill in the "sync: false" values when prompted.
services:
  - type: web
    name: primebid
    runtime: node
    plan: starter # the free plan sleeps when idle, which pauses the auction-ending job
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: COOKIE_EXPIRE
        value: "7"
      - key: COOKIE_SAMESITE
        value: lax
      - key: TRUST_PROXY
        value: "1"
      - key: MONGO_URI
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_MAIL
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: CONTACT_RECEIVER_EMAIL
        sync: false
